name: NothingsVN Xiaomi ROM Build
run-name: ${{ inputs.request_id || 'manual-xiaomi-build' }}
on:
  workflow_dispatch:
    inputs:
      input_url:
        description: Xiaomi ROM URL
        required: true
      install_toolbox:
        description: Install NTManager
        type: boolean
        default: true
      install_mods:
        description: Apply Xiaomi ROM modifications
        type: boolean
        default: true
      build_mode:
        description: Package format
        type: choice
        options: [fastboot, ota, both]
        default: fastboot
      builder_name:
        description: Telegram display name
        required: false
      builder_id:
        description: Telegram user ID
        required: false
      request_id:
        description: Telegram build request ID
        default: manual-xiaomi-build
      check_only:
        description: Verify private checkout, dependencies and upload access without building a ROM
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  Build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    env:
      SOURCE_REPOSITORY: ncd03-nb/nothingsvn_xiaomi-toolbuild
      SOURCE_DIR: ${{ github.workspace }}/source
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_BUILD_ID: ${{ inputs.request_id }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      GOOGLE_OAUTH_CREDENTIALS_JSON: ${{ secrets.GOOGLE_OAUTH_CREDENTIALS_JSON }}
      INSTALL_TOOLBOX: ${{ inputs.install_toolbox }}
      INSTALL_MODS: ${{ inputs.install_mods }}
      BUILD_MODE: ${{ inputs.build_mode }}
      INPUT_URL: ${{ inputs.input_url }}
      BUILDER_NAME: ${{ inputs.builder_name }}
      BUILDER_ID: ${{ inputs.builder_id }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      # APT/initramfs must finish while the runner's root filesystem still has
      # space. The disk-space action shrinks that filesystem for its LVM mount.
      - name: Clean unused runner files before installing dependencies
        run: |
          sudo apt-get purge -y azure-cli firefox google-chrome-stable powershell || true
          sudo apt-get purge -y 'dotnet*' 'php*' 'mysql*' || true
          sudo apt-get autoremove --purge -y || true
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/google/chrome
          df -h / /boot
      - name: Set timezone
        run: sudo timedatectl set-timezone Asia/Ho_Chi_Minh
      - name: Install OpenJDK before resizing disk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Xiaomi build dependencies before resizing disk
        run: |
          set -euo pipefail
          retries=(-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get "${retries[@]}" update
          sudo apt-get "${retries[@]}" install -y --no-install-recommends \
            aria2 jq rclone sshpass python-is-python3 wget python3 python3-pip \
            lz4 xz-utils zlib1g-dev gcc g++ libc6 libstdc++6 dialog aapt apksigner \
            busybox zip erofs-utils e2fsprogs unzip p7zip-full zipalign zstd bc \
            android-sdk-libsparse-utils xmlstarlet patchelf python3-pyelftools
          pip_args=(--no-cache-dir --retries 5 --timeout 60)
          if python3 -m pip install --help | grep -q -- '--break-system-packages'; then
            pip_args+=(--break-system-packages)
          fi
          python3 -m pip install "${pip_args[@]}" ConfigObj telebot setuptools lz4 zstandard requests google-api-python-client google-auth
          sudo dpkg --audit
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h / /boot
      - name: Maximize build space with room left for the OS
        uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
        with:
          swap-size-mb: 256
          root-reserve-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
      - name: Checkout private Xiaomi source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ssh-key: ${{ secrets.XIAOMI_REPO_DEPLOY_KEY }}
          fetch-depth: 1
          path: source
          persist-credentials: false
      - name: Release private Git metadata space
        working-directory: source
        run: |
          sudo rm -rf .git/objects .git/lfs
          sudo mkdir -p .git/objects/info .git/objects/pack
          df -h . /
      - name: Verify tools and private upload access
        working-directory: source
        run: |
          set -euo pipefail
          bash -n build.sh packROM.sh uploadROM.sh
          python3 - <<'PY'
          import ast, json, os, pathlib, urllib.request, urllib.parse
          import lz4, zstandard, requests, telebot, configobj
          for name in ('notify.py','upload_rom_api.py'):
              ast.parse(pathlib.Path(name).read_text(encoding='utf8'))
          obj=json.loads(os.environ['GOOGLE_OAUTH_CREDENTIALS_JSON'])
          data=urllib.parse.urlencode({'grant_type':'refresh_token',**{k:obj[k] for k in ('client_id','client_secret','refresh_token')}}).encode()
          with urllib.request.urlopen(urllib.request.Request('https://oauth2.googleapis.com/token',data=data),timeout=30) as r:
              token=json.load(r)['access_token']
          req=urllib.request.Request('https://www.googleapis.com/drive/v3/files/'+os.environ['GDRIVE_FOLDER_ID']+'?fields=mimeType,capabilities(canAddChildren)&supportsAllDrives=true',headers={'Authorization':'Bearer '+token})
          with urllib.request.urlopen(req,timeout=30) as r:
              folder=json.load(r)
          assert folder['mimeType']=='application/vnd.google-apps.folder' and folder['capabilities']['canAddChildren']
          print('Xiaomi source, dependencies and writable Drive destination: OK')
          PY
      - name: Verify Python font compatibility and private notification routing
        working-directory: source
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_notify.py -v
          python3 - <<'PY'
          import hashlib, importlib.util, pathlib, sys, tempfile
          path=pathlib.Path('bin/package/NTManager/system-fonts/install.py')
          spec=importlib.util.spec_from_file_location('ntfonts',path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          with tempfile.TemporaryDirectory() as directory:
              fixture=pathlib.Path(directory)/'framework.jar'
              for data in (b'',b'\x00\xffjar\r\n',bytes(range(256))*8193):
                  fixture.write_bytes(data)
                  assert module.sha(fixture)==hashlib.sha256(data).hexdigest()
          print('Font SHA-256 compatibility: OK; Python',sys.version.split()[0])
          PY
      - name: Send start notification
        if: ${{ !inputs.check_only }}
        working-directory: source
        run: python3 notify.py start "$SOURCE_REPOSITORY" "$INPUT_URL" xiaomi "$BUILDER_NAME" "$BUILDER_ID"
      - name: Build ROM
        if: ${{ !inputs.check_only }}
        working-directory: source
        run: |
          set -euo pipefail
          sudo chmod 777 -R .
          sudo -E bash build.sh "$INPUT_URL" "$SOURCE_REPOSITORY" xiaomi "$BUILDER_NAME" "$BUILDER_ID" 2>&1 | tee -a build_action.log
      - name: Pack ROM
        if: ${{ !inputs.check_only }}
        working-directory: source
        run: |
          set -euo pipefail
          python3 notify.py pack "$SOURCE_REPOSITORY" "$INPUT_URL" xiaomi "$BUILDER_NAME" "$BUILDER_ID"
          sudo -E bash packROM.sh 2>&1 | tee -a build_action.log
      - name: Upload ROM to Drive
        if: ${{ !inputs.check_only }}
        working-directory: source
        run: |
          set -euo pipefail
          python3 notify.py upload "$SOURCE_REPOSITORY" "$INPUT_URL" xiaomi "$BUILDER_NAME" "$BUILDER_ID"
          sudo -E bash uploadROM.sh 2>&1 | tee -a build_action.log
      - name: Send success notification
        if: ${{ success() && !inputs.check_only }}
        working-directory: source
        env:
          NOTIFY_WORKFLOW_CONCLUSION: success
        run: python3 notify.py success "$SOURCE_REPOSITORY" "$INPUT_URL" xiaomi "$BUILDER_NAME" "$BUILDER_ID"
      - name: Send failure or cancellation notification
        if: ${{ (failure() || cancelled()) && !inputs.check_only }}
        working-directory: source
        env:
          NOTIFY_WORKFLOW_CONCLUSION: ${{ job.status }}
          NOTIFY_ERROR_LOG: build_action.log
        run: |
          status=fail
          if [[ "${{ job.status }}" == cancelled ]]; then status=cancelled; fi
          if [[ -f notify.py ]]; then
            python3 notify.py "$status" "$SOURCE_REPOSITORY" "$INPUT_URL" xiaomi "$BUILDER_NAME" "$BUILDER_ID"
          fi
      # The private source tree is never exposed as a public artifact.
