name: NothingsVN Oplus ROM Build

run-name: ${{ inputs.request_id || 'manual-build' }}

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: URL of the BASE ROM for the target device
        required: true
      portrom_url:
        description: URL of the PORT ROM; leave empty for base-ROM-only mode
        required: false
      install_toolbox:
        description: Install Kaorios Toolbox and framework patches
        required: false
        type: boolean
        default: true
      install_mods:
        description: Install ROM-version-specific mods
        required: false
        type: boolean
        default: true
      build_mode:
        description: Deliver a flash package, OTA, or both
        required: false
        type: choice
        options: [fastboot, ota, both]
        default: fastboot
      builder_name:
        description: Builder name
        required: false
      builder_id:
        description: Builder ID
        required: false
      request_id:
        description: Request ID generated by the Telegram bot
        required: false
        default: manual-build

# The public wrapper never needs write access to its own repository.
permissions:
  contents: read

jobs:
  Build:
    # Keep the Ubuntu release used by the OPlus toolchain.
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    env:
      SOURCE_REPOSITORY: ncd03-nb/nothingsvn_oplus-pt.toolbuild
      SOURCE_DIR: ${{ github.workspace }}/source
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_BUILD_ID: ${{ inputs.request_id }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_CREDENTIALS_JSON: ${{ secrets.GOOGLE_OAUTH_CREDENTIALS_JSON }}
      INSTALL_TOOLBOX: ${{ inputs.install_toolbox }}
      INSTALL_MODS: ${{ inputs.install_mods }}
      BUILD_MODE: ${{ inputs.build_mode }}

    steps:
      - name: Set up toolbuild Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify Python for regular and privileged build commands
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12); print("Runner Python:", sys.version)'
          sudo -E env PATH="$PATH" LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" python3 -c 'import sys; assert sys.version_info[:2] == (3, 12); print("Privileged build Python:", sys.version)'
      - name: Clean unused runner files
        run: |
          sudo apt-get purge -y azure-cli firefox google-chrome-stable powershell || true
          sudo apt-get purge -y 'dotnet*' 'php*' 'mysql*' || true
          sudo apt-get autoremove --purge -y || true
          sudo apt-get clean || true
          sudo rm -rf /usr/share/swift /opt/google/chrome /etc/mysql /etc/php || true

      - name: Maximize build space
        uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
        with:
          swap-size-mb: 256
          root-reserve-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ssh-key: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
          fetch-depth: 1
          path: source
          persist-credentials: false

      - name: Release private Git metadata space
        working-directory: source
        run: |
          sudo rm -rf .git/objects .git/lfs
          sudo mkdir -p .git/objects/info .git/objects/pack
          df -h . /

      - name: Set timezone
        run: sudo timedatectl set-timezone Asia/Ho_Chi_Minh

      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install notification dependency
        run: python3 -m pip install requests

      - name: Send start notification
        working-directory: source
        run: >-
          python notify.py start "$SOURCE_REPOSITORY" "${{ inputs.input_url }}"
          "oplus" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}"

      - name: Install build tools
        working-directory: source
        run: |
          set -euo pipefail
          echo "[STEP] Install tools" | tee -a build_action.log
          {
            . /etc/os-release
            suites=("$VERSION_CODENAME" "$VERSION_CODENAME-updates" "$VERSION_CODENAME-security" "$VERSION_CODENAME-backports")
            mirror=
            for candidate in https://archive.ubuntu.com/ubuntu https://mirrors.edge.kernel.org/ubuntu; do
              reachable=true
              for suite in "${suites[@]}"; do
                if ! curl -fsSL --connect-timeout 4 --max-time 8 -o /dev/null "$candidate/dists/$suite/InRelease"; then
                  reachable=false
                  break
                fi
              done
              if "$reachable"; then
                mirror="$candidate"
                break
              fi
              echo "[WARN] - Ubuntu APT mirror unavailable: $candidate"
            done
            if [[ -z "$mirror" ]]; then
              echo '[ERROR] - No reachable Ubuntu APT mirror; check runner network/DNS.'
              exit 1
            fi

            # setup.sh uses nested sudo, so use a runner-local APT config fragment.
            # Keep the image's default sources and mirror list available for other steps.
            source_list=/etc/apt/nt-oplus-build.list
            apt_config=/etc/apt/apt.conf.d/99-nt-oplus-build
            trap 'sudo rm -f -- "$apt_config" "$source_list"' EXIT
            for suite in "${suites[@]}"; do
              printf 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] %s %s main restricted universe multiverse\n' "$mirror" "$suite"
            done | sudo tee "$source_list" >/dev/null
            sudo tee "$apt_config" >/dev/null <<EOF
          Dir::Etc::SourceList "$source_list";
          Dir::Etc::SourceParts "-";
          APT::Update::Error-Mode "any";
          Acquire::Languages "none";
          EOF
            echo "[SETUP] - Using Ubuntu APT mirror: $mirror"
            status=0
            sudo -E env PATH="$PATH" LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" timeout --kill-after=15s 6m bash setup.sh || status=$?
            if [[ "$status" == 124 || "$status" == 137 ]]; then
              echo '[ERROR] - Build tool installation exceeded the time limit.'
            fi
            if [[ "$status" != 0 ]]; then
              exit "$status"
            fi
            df -h . /
          } 2>&1 | tee -a build_action.log

      - name: Verify NTManager patch syntax with the build interpreter
        working-directory: source
        run: |
          set -euo pipefail
          sudo -E env PATH="$PATH" LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" python3 - <<'PY'
          import pathlib, sys
          import requests, google.auth
          assert sys.version_info[:2] == (3, 12)
          paths=sorted(pathlib.Path('bin/package/FrameworkPatcher/NTManager').rglob('*.py'))
          assert paths, 'NTManager Python patches are missing'
          for path in paths:
              compile(path.read_bytes(),str(path),'exec')
          print('NTManager patch syntax: OK;',len(paths),'files; Python',sys.version.split()[0])
          PY
      - name: Grant source permissions
        working-directory: source
        run: sudo chmod 777 -R .

      - name: Build ROM
        working-directory: source
        env:
          INPUT_URL: ${{ inputs.input_url }}
          PORTROM_URL: ${{ inputs.portrom_url }}
        run: |
          set -euo pipefail
          printf 'install_toolbox=%s\ninstall_mods=%s\nbuild_mode=%s\n' "$INSTALL_TOOLBOX" "$INSTALL_MODS" "$BUILD_MODE" > config.env
          echo "[CONFIG] Toolbox=$INSTALL_TOOLBOX, Mods=$INSTALL_MODS, Mode=$BUILD_MODE" | tee -a build_action.log
          sudo -E env PATH="$PATH" LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" bash build.sh "$INPUT_URL" "$PORTROM_URL" "n" "$SOURCE_REPOSITORY" "oplus" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}" 2>&1 | tee -a build_action.log

      - name: Pack ROM
        working-directory: source
        run: |
          set -euo pipefail
          python notify.py pack "$SOURCE_REPOSITORY" "${{ inputs.input_url }}" "oplus" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}"
          sudo -E env PATH="$PATH" LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" bash packROM.sh n 2>&1 | tee -a build_action.log

      - name: Upload ROM to cloud
        working-directory: source
        run: |
          set -euo pipefail
          python notify.py upload "$SOURCE_REPOSITORY" "${{ inputs.input_url }}" "oplus" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}"
          sudo -E env PATH="$PATH" LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" bash uploadROM.sh 2>&1 | tee -a build_action.log

      - name: Send success notification
        if: success()
        working-directory: source
        env:
          NOTIFY_WORKFLOW_CONCLUSION: success
        run: >-
          python notify.py success "$SOURCE_REPOSITORY" "${{ inputs.input_url }}"
          "oplus" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}"

      - name: Send failure or cancellation notification
        if: failure() || cancelled()
        continue-on-error: true
        env:
          NOTIFY_WORKFLOW_CONCLUSION: ${{ job.status }}
          NOTIFY_ERROR_LOG: ${{ github.workspace }}/source/build_action.log
          FALLBACK_BUILDER_ID: ${{ inputs.builder_id }}
        run: |
          status=fail
          message='Build failed before the private notification script was available.'
          if [[ "${{ job.status }}" == "cancelled" ]]; then
            status=cancelled
            message='Build was cancelled.'
          fi

          if [[ -f "$SOURCE_DIR/notify.py" ]]; then
            cd "$SOURCE_DIR"
            python notify.py "$status" "$SOURCE_REPOSITORY" "${{ inputs.input_url }}" "oplus" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}"
          elif [[ -n "$TELEGRAM_BOT_TOKEN" && "$FALLBACK_BUILDER_ID" =~ ^[1-9][0-9]*$ ]]; then
            chat_id="$FALLBACK_BUILDER_ID"
            curl --fail --silent --show-error --max-time 30 --retry 2 \
              --data-urlencode "chat_id=$chat_id" \
              --data-urlencode "text=$message Build: ${TELEGRAM_BUILD_ID:-unknown}" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          fi
